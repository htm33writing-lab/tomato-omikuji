<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開運トマト 養生おみくじ 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;
  --bg2:#f2f0eb;
  --text:#2c2a25;
  --muted:#7a7670;
  --border:#d8d4cc;
  --accent:#8B4513;
  --accent2:#C85A2A;
}
body{font-family:'Noto Sans JP',sans-serif;font-weight:300;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem 4rem}
.header{text-align:center;padding:2rem 0 2rem;border-bottom:0.5px solid var(--border);margin-bottom:2rem}
.tomato-mark{font-size:32px;display:block;margin-bottom:10px}
.header-ja{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:500;letter-spacing:0.15em;color:var(--text);display:block}
.header-sub{font-size:12px;color:var(--muted);letter-spacing:0.1em;margin-top:6px;display:block}
.step{display:none}
.step.active{display:block}
.check-title{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:500;margin-bottom:6px;color:var(--text)}
.check-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.7}
.month-label{font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-bottom:6px}
.month-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.month-btn{padding:7px 18px;background:transparent;border:0.5px solid var(--border);border-radius:20px;font-size:13px;color:var(--muted);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif}
.month-btn.active{border-color:var(--accent);color:var(--accent)}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.type-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s,background 0.2s;text-align:left}
.type-card:hover{border-color:#aaa}
.type-card.selected{border-color:var(--accent2);background:#fff}
.type-card .icon{font-size:20px;margin-bottom:6px;display:block}
.type-card .name{font-size:14px;font-weight:500;color:var(--text);display:block;margin-bottom:2px}
.type-card .desc{font-size:12px;color:var(--muted);line-height:1.5}
.draw-section{text-align:center;padding:1.5rem 0}
.draw-title{font-family:'Shippori Mincho',serif;font-size:14px;color:var(--muted);margin-bottom:1.5rem;letter-spacing:0.08em}
.draw-btn{display:inline-block;padding:15px 48px;background:transparent;border:0.5px solid var(--accent);border-radius:8px;font-family:'Shippori Mincho',serif;font-size:16px;font-weight:500;color:var(--accent);cursor:pointer;letter-spacing:0.12em;transition:background 0.2s,color 0.2s}
.draw-btn:hover{background:var(--accent);color:#fff}
.draw-btn:disabled{opacity:0.35;cursor:default}
.result-card{background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.hexagram{text-align:center;margin-bottom:1.5rem}
.hex-symbol{font-size:52px;line-height:1;display:block;margin-bottom:8px}
.hex-name{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:500;letter-spacing:0.2em;color:var(--text);display:block}
.hex-reading{font-size:13px;color:var(--muted);letter-spacing:0.08em;margin-top:4px;display:block}
.divider{width:40px;height:0.5px;background:var(--border);margin:1rem auto}
.fortune-msg{font-family:'Shippori Mincho',serif;font-size:15px;color:var(--text);line-height:1.9;text-align:center;margin-bottom:1rem}
.luck-badge{display:inline-block;padding:3px 16px;border:0.5px solid var(--accent);border-radius:20px;font-size:11px;color:var(--accent);letter-spacing:0.12em;margin-bottom:1rem}
.recipe-label{font-size:11px;color:var(--muted);letter-spacing:0.12em;margin-bottom:8px}
.recipe-name{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:500;color:var(--text);margin-bottom:12px}
.ingredient-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ingredient-pill{font-size:12px;background:var(--bg2);border:0.5px solid var(--border);border-radius:20px;padding:4px 12px;color:var(--text)}
.recipe-steps{margin-top:10px}
.step-item{display:flex;gap:10px;margin-bottom:8px;font-size:13px;color:var(--muted);line-height:1.6}
.step-num{color:var(--accent2);font-weight:500;min-width:16px;font-family:'Shippori Mincho',serif}
.acupoint{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.8}
.acupoint strong{color:var(--text);font-weight:500}
.bottom-row{display:flex;gap:10px;margin-top:1.5rem}
.btn-secondary{flex:1;padding:13px;background:transparent;border:0.5px solid var(--border);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;transition:border-color 0.2s}
.btn-secondary:hover{border-color:#aaa;color:var(--text)}
.btn-primary{flex:1;padding:13px;background:transparent;border:0.5px solid var(--accent);border-radius:8px;font-family:'Shippori Mincho',serif;font-size:14px;color:var(--accent);cursor:pointer;letter-spacing:0.06em;transition:background 0.2s,color 0.2s}
.btn-primary:hover{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.4s ease both}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <span class="tomato-mark">🍅</span>
  <span class="header-ja">開運トマト 養生おみくじ</span>
  <span class="header-sub">2026 丙午 &#8231; 体質から引く、今日の一卦</span>
</div>

<div id="step1" class="step active">
  <p class="check-title">今のあなたはどのタイプ？</p>
  <p class="check-sub">当てはまるものを選んでください。複数あれば最も気になるものを。</p>
  <div class="month-label">今の季節・月を選ぶ</div>
  <div class="month-row" id="monthRow">
    <button class="month-btn active" data-m="4">4月</button>
    <button class="month-btn" data-m="5">5月</button>
    <button class="month-btn" data-m="6">6月</button>
    <button class="month-btn" data-m="7">7月</button>
  </div>
  <div class="type-grid" id="typeGrid">
    <div class="type-card" data-type="0">
      <span class="icon">△</span>
      <span class="name">エネルギー不足</span>
      <span class="desc">疲れやすく、やる気が出ない。朝が重い。</span>
    </div>
    <div class="type-card" data-type="1">
      <span class="icon">〜</span>
      <span class="name">ストレス・イライラ</span>
      <span class="desc">感情の波が激しく、気が張っている。</span>
    </div>
    <div class="type-card" data-type="2">
      <span class="icon">◇</span>
      <span class="name">うるおい不足</span>
      <span class="desc">肌や目が乾燥する。ほてりがある。</span>
    </div>
    <div class="type-card" data-type="3">
      <span class="icon">■</span>
      <span class="name">巡り滞り</span>
      <span class="desc">肩こりや頭痛が定着。目の下にクマ。</span>
    </div>
    <div class="type-card" data-type="4" style="grid-column:span 2">
      <span class="icon">○</span>
      <span class="name">むくみ・水溜まり</span>
      <span class="desc">体が重だるく、雨の日に不調になる。夕方に靴がきつい。</span>
    </div>
  </div>
  <div class="draw-section">
    <p class="draw-title">体質を選んで、卦を引いてください</p>
    <button class="draw-btn" id="drawBtn" disabled onclick="drawOmikuji()">卦を引く</button>
  </div>
</div>

<div id="step2" class="step">
  <div id="resultContent"></div>
  <div class="bottom-row">
    <button class="btn-secondary" onclick="reset()">最初からやり直す</button>
    <button class="btn-primary" onclick="copyRecipe()">レシピをコピー</button>
  </div>
</div>
</div>

let selectedType=null, selectedMonth=4;

document.querySelectorAll('.month-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedMonth=parseInt(btn.dataset.m);
  });
});

document.querySelectorAll('.type-card').forEach(card=>{
  card.addEventListener('click',()=>{
    document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    selectedType=parseInt(card.dataset.type);
    document.getElementById('drawBtn').disabled=false;
  });
});

function drawOmikuji(){
  const hex=DATA.hexagrams[Math.floor(Math.random()*DATA.hexagrams.length)];
  const fi=Math.floor(Math.random()*DATA.fortunes.length);
  const recipe=DATA.recipes[selectedType][selectedMonth];
  const typeName=DATA.types[selectedType];
  window._lastRecipe={type:typeName,month:selectedMonth,name:recipe.name,hex:hex.name,recipe:recipe};
  const html=`
  <div class="result-card fade-in">
    <div class="hexagram">
      <span class="hex-symbol">${hex.symbol}</span>
      <span class="hex-name">${hex.name}</span>
      <span class="hex-reading">（${hex.reading}）${hex.meaning}</span>
    </div>
    <div style="text-align:center">
      <span class="luck-badge">${DATA.fortunes[fi]}</span>
    </div>
    <div class="divider"></div>
    <p class="fortune-msg">${DATA.messages[fi]}</p>
  </div>
  <div class="result-card fade-in" style="animation-delay:0.15s">
    <p class="recipe-label">○ ${typeName}タイプへ · ${selectedMonth}月のレシピ</p>
    <p class="recipe-name">${recipe.name}</p>
    <div class="ingredient-row">${recipe.ingredients.map(i=>`<span class="ingredient-pill">${i}</span>`).join('')}</div>
    <div class="recipe-steps">
      ${recipe.steps.map((s,i)=>`<div class="step-item"><span class="step-num">${i+1}</span><span>${s}</span></div>`).join('')}
    </div>
    <div class="acupoint"><strong>養生ポイント：</strong>${recipe.point}<br><strong>ツボ：</strong>${recipe.acupoint}</div>
  </div>`;
  document.getElementById('resultContent').innerHTML=html;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
}

function reset(){
  selectedType=null; selectedMonth=4;
  document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.month-btn[data-m="4"]').classList.add('active');
  document.getElementById('drawBtn').disabled=true;
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
}

function copyRecipe(){
  const r=window._lastRecipe;
  if(!r) return;
  const text=`【${r.month}月の開運レシピ】${r.name}\n\n材料：${r.recipe.ingredients.join('、')}\n\n作り方：\n${r.recipe.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n養生ポイント：${r.recipe.point}\nツボ：${r.recipe.acupoint}`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>alert('レシピをコピーしました'));
  } else {
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); alert('レシピをコピーしました');
  }
}
</script>
</body>
</html>
